
<!DOCTYPE html>
<html>
<head>
    <title>E-Commerce Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>My Shopping Store</h1>
        <p>Welcome to Online Shopping</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">Offers</a>
        <a href="#">Contact</a>
    </nav>

    <h2>Our Products</h2>

    <div class="products">

        <div class="card">
            <img src="mobile phone.webp"Mobile">
            <h3>Mobile Phone</h3>
            <p>Price: ₹12,000</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="laptop.jpg"Laptop">
            <h3>Laptop</h3>
            <p>Price: ₹45,000</p>
            <button>Add to Cart</button>
        </div>

        <div class="card">
            <img src="headphones.jpg" alt="Headphones">
            <h3>Headphones</h3>
            <p>Price: ₹1,500</p>
            <button>Add to Cart</button>
        </div>

    </div>

    <footer>
        <p>Copyright 2026 My Shopping Store</p>
    </footer>

</body>
</html>
